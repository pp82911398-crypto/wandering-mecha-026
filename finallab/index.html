<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0e1114;color:#d9dcdf;font-family:"PingFang SC","Noto Sans SC",sans-serif;overflow:hidden}
#c{position:fixed;inset:0}
#c canvas{display:block;width:100%;height:100%}
.ui{position:fixed;left:16px;top:14px;right:16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:12px;pointer-events:none}
.ui>*{pointer-events:auto}
.ui h1{font-size:16px;letter-spacing:.12em;font-weight:700;margin-right:6px}
.ui h1 em{font-style:normal;color:#ffab3d}
.ui label{display:flex;gap:6px;align-items:center;color:#9aa1a7}
.ui input[type=range]{width:110px;accent-color:#ffab3d}
.ui b{font-family:Menlo,monospace;font-weight:400;color:#e9ecee;width:32px}
.ui button{font:inherit;padding:4px 10px;background:rgba(20,24,28,.6);border:1px solid #3a4148;color:#d9dcdf;cursor:pointer}
.ui select{font:inherit;padding:3px 6px;background:rgba(20,24,28,.6);border:1px solid #3a4148;color:#d9dcdf}
.ui button:hover{border-color:#ffab3d}
#status{margin-left:auto;font-family:Menlo,monospace;color:#7d858c}
body.shot .ui{display:none}
#togglePanel{margin-left:8px}
#panel{position:fixed;right:12px;top:52px;bottom:12px;width:300px;overflow:auto;background:rgba(14,17,20,.78);border:1px solid #2c3238;backdrop-filter:blur(6px);font-size:12px;scrollbar-width:thin}
body.nopanel #panel{display:none}
#panel details{border-bottom:1px solid #262b31}
#panel summary{cursor:pointer;padding:9px 12px;font-weight:600;letter-spacing:.06em;color:#e3e6e8;list-style:none;user-select:none}
#panel summary::before{content:"▸ ";color:#ffab3d}#panel details[open] summary::before{content:"▾ "}
#panel .sec{padding:2px 12px 10px}
#panel .row{display:grid;grid-template-columns:86px 1fr 40px;align-items:center;gap:8px;margin:5px 0;color:#9aa1a7}
#panel .row.chk{grid-template-columns:18px 1fr}
#panel input[type=range]{width:100%;accent-color:#ffab3d}
#panel b{font-family:Menlo,monospace;font-weight:400;color:#e9ecee;text-align:right}
#panel select{grid-column:2/4;font:inherit;padding:3px 6px;background:#1a1f24;border:1px solid #3a4148;color:#d9dcdf}
#panel .btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
#panel button{font:inherit;padding:4px 10px;background:#1a1f24;border:1px solid #3a4148;color:#d9dcdf;cursor:pointer}
#panel button:hover{border-color:#ffab3d}
#panel .note{color:#7d858c;font-size:11px;margin:4px 0 6px;line-height:1.5}
@media (max-width:640px){#panel{width:auto;left:12px;top:auto;height:46vh}}
</style>
</head>
<body>
<div id="c"></div>
<div class="ui">
  <h1>机甲 <em>026</em> · 成品间</h1>
  <span id="status">加载中…</span>
  <button id="togglePanel">控制面板</button>
</div>
<aside id="panel"></aside>
<script type="module" src="./lab.js?v=default-stance-20261023a"></script>
