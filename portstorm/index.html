<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>DeepSeek 场景搭建页面</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
  "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.8.3/build/index.module.js",
  "three-bvh-csg": "https://cdn.jsdelivr.net/npm/three-bvh-csg@0.0.17/build/index.module.js"
} }
</script>
<style>
#backFin,#toHangar,#docLink{pointer-events:auto}
#backFin{top:22px;right:320px;color:var(--ink);text-decoration:none;font:12px/1.2 var(--cn);letter-spacing:.06em;border:1px solid var(--line);background:var(--panel);padding:8px 12px;backdrop-filter:blur(10px)}
#docLink{top:22px;right:26px;color:#9fb3bf;text-decoration:none;font:12px/1.2 var(--cn);border:1px solid var(--line);background:var(--panel);padding:8px 12px}
#toHangar{top:22px;right:190px;color:var(--ink);text-decoration:none;font:12px/1.2 var(--cn);letter-spacing:.06em;border:1px solid var(--line);background:var(--panel);padding:8px 12px;backdrop-filter:blur(10px)}
#toHangar:hover{border-color:var(--acc);color:#fff}
#backFin:hover{border-color:var(--acc);color:#fff}
#stormInfo{top:64px;right:26px;font:10px/1.2 var(--mono);letter-spacing:.14em;color:#b9c9d4;border:1px solid rgba(160,190,210,.22);background:rgba(12,18,22,.7);padding:9px 12px}
#stormExpWrap{left:26px;top:96px;font:10px/1.2 var(--mono);letter-spacing:.08em;color:var(--dim);display:flex;align-items:center;gap:8px;background:rgba(12,18,22,.55);border:1px solid var(--line);padding:6px 10px}
#stormExp{width:120px;accent-color:var(--acc)}
#stormExpVal{color:var(--ink);min-width:30px}

:root{--ink:#ece9df;--dim:#9a978d;--line:rgba(236,233,223,.18);--panel:rgba(18,21,23,.74);--acc:#d86a2a;--mono:"JetBrains Mono",monospace;--cn:"Noto Sans SC","PingFang SC",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0d1215;color:var(--ink);font-family:var(--cn)}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
.ui{position:fixed;z-index:10;pointer-events:none}
.ui>*{pointer-events:auto}
header{top:22px;left:26px;display:flex;flex-direction:column;gap:6px}
header h1{font-size:20px;letter-spacing:.14em;font-weight:700}
header .sub{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--dim)}
header .tag{display:inline-flex;align-items:center;gap:8px;font-size:10px;color:var(--dim);font-family:var(--mono)}
header .tag i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc);display:inline-block}
#scale{top:24px;right:26px;text-align:right;font-family:var(--mono);font-size:10px;color:var(--dim);line-height:1.7;letter-spacing:.04em}
#scale b{color:var(--ink);font-weight:500}
#playbar{left:26px;bottom:24px;width:min(560px,calc(100vw - 52px));background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);padding:14px 16px 12px}
.row{display:flex;align-items:center;gap:14px}
#playBtn{font:inherit;font-size:14px;font-weight:700;letter-spacing:.1em;color:#141414;background:var(--acc);border:0;padding:0 22px;height:46px;min-width:104px;cursor:pointer;transition:.15s}
#playBtn:hover{background:#e57a38}
#playBtn.playing{background:#e9e3d6;color:#1b1b1b}
.timeline{flex:1;min-width:0}
.bar{position:relative;display:flex;align-items:center;gap:10px}
#progress{width:100%;accent-color:var(--acc);height:20px;cursor:pointer}
.meta{display:flex;justify-content:space-between;gap:12px;margin-top:4px;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.05em}
#phase{color:var(--ink);font-family:var(--cn);font-size:12px;letter-spacing:.06em}
.marks{position:relative;height:16px;margin:2px 2px 0;font-family:var(--mono);font-size:9px;color:var(--dim)}
.marks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.marks span:first-child{transform:none}
.marks span:last-child{transform:translateX(-100%)}
.marks i{position:absolute;top:-2px;width:1px;height:7px;background:var(--line)}
#cams{right:26px;bottom:24px;display:grid;grid-template-columns:1fr 1fr;gap:6px;width:286px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);padding:10px}
#cams button{font:inherit;font-size:12px;letter-spacing:.06em;padding:9px 8px;color:var(--ink);background:rgba(255,255,255,.035);border:1px solid var(--line);cursor:pointer;transition:.15s;text-align:left}
#cams button:hover{background:rgba(255,255,255,.09)}
#cams button.on{background:var(--acc);color:#141414;border-color:var(--acc);font-weight:700}
#hint{right:26px;bottom:calc(24px + 196px);font-family:var(--mono);font-size:9px;color:var(--dim);text-align:right;letter-spacing:.06em}
#loading{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0d1215;color:var(--dim);font-family:var(--mono);font-size:11px;letter-spacing:.14em;transition:opacity .6s}
#loading.hide{opacity:0;pointer-events:none}
#loading .bar2{width:180px;height:2px;background:rgba(255,255,255,.12);overflow:hidden}
#loading .bar2 i{display:block;width:40%;height:100%;background:var(--acc);animation:load 1.2s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
#loading b{color:var(--ink);font-weight:500;letter-spacing:.2em}
body.shot .ui,body.shot header,body.shot #cams,body.shot #hint,body.shot #scale,body.shot #playbar,body.shot #loading{display:none!important}
@media (max-width:820px){
  header{top:14px;left:16px} header h1{font-size:16px} #scale{display:none}
  #playbar{left:12px;bottom:12px;width:calc(100vw - 24px);padding:10px}
  #cams{right:auto;left:12px;bottom:calc(12px + 108px);width:calc(100vw - 24px);grid-template-columns:repeat(3,1fr)}
  #hint{display:none}
}
</style>
</head>
<body>
<div id="stage"></div>

<div id="stormInfo" class="ui">DEEPSEEK · 场景搭建</div>
<label id="stormExpWrap" class="ui">曝光 <input id="stormExp" type="range" min="0.45" max="1.6" step="0.01" value="0.92"><span id="stormExpVal">0.92</span></label>

<header class="ui">
  <h1>DeepSeek 场景搭建页面</h1>
  <span class="sub">DEEPSEEK SCENE BUILD · PORT STORM</span>
  <span class="tag"><i></i>港口暴雨 · 026 成品机甲</span>
</header>

<div id="scale" class="ui">
  <b>1 单位 ≈ 2.05 m</b><br>
  机甲 40 单位 ≈ 82 m<br>
  机库大厅 96 × 82 × 135<br>
  履带平台 30 × 42
</div>

<div id="hint" class="ui">拖拽旋转 · 滚轮缩放 · 跟随中拖动即切自由视角 · ?q=low 关后期</div>

<section id="playbar" class="ui">
  <div class="row">
    <button id="playBtn">出库</button>
    <div class="timeline">
      <div class="bar"><input id="progress" type="range" min="0" max="1000" step="1" value="1000"></div>
      <div class="marks">
        <i style="left:10%"></i><span style="left:10%">灯</span>
        <i style="left:12%"></i><span style="left:12%">开门</span>
        <i style="left:32%"></i><span style="left:32%">出库</span>
        <i style="left:88%"></i><span style="left:88%">停靠</span>
        <i style="left:90%"></i>
      </div>
      <div class="meta"><span id="phase">已停靠</span><span id="tval">100%</span></div>
    </div>
  </div>
</section>

<nav id="cams" class="ui">
  <button data-cam="follow">跟随平台</button>
  <button data-cam="hangar">机库内</button>
  <button data-cam="hall">机库全景</button>
  <button data-cam="mech">机甲特写</button>
  <button data-cam="gate">机库门口</button>
  <button data-cam="wide" class="on">码头远景</button>
  <button data-cam="overview">码头全貌</button>
  <button data-cam="sea">海面仰视</button>
</nav>

<div id="loading"><b>BASELAB 04</b><span id="loadText">烘焙机库材质与细节…</span><div class="bar2"><i></i></div></div>

<script type="module" src="./main.js"></script>
<script type="module" src="./storm.js"></script>
<script type="module" src="./freecam.js"></script>
<script type="module" src="./outdoor.js"></script>
<script type="module" src="./showcase.js"></script>
<script src="../scenenav.js" data-current="port"></script>
</body>
</html>
